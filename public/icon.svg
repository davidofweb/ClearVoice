<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#26262f" stroke-width="3"/>

  <!-- Concentric noise-cancellation isolation rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#272732" stroke-width="3" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#3b3b4d" stroke-width="2.5" opacity="0.8"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.3"/>

  <!-- Center recording mic capsule -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="76" fill="url(#glow)"/>
    <circle cx="256" cy="256" r="66" fill="#0f0f14"/>
  </g>

  <!-- Soundwave bars in center -->
  <rect x="206" y="236" width="10" height="40" rx="5" fill="#ef4444"/>
  <rect x="226" y="216" width="10" height="80" rx="5" fill="#f87171"/>
  <rect x="246" y="196" width="10" height="120" rx="5" fill="#ffffff"/>
  <rect x="266" y="206" width="10" height="100" rx="5" fill="#f87171"/>
  <rect x="286" y="226" width="10" height="60" rx="5" fill="#ef4444"/>
</svg>
